<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ffd6e7;overflow:hidden;height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Poppins',sans-serif}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.card{position:relative;z-index:2;background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);padding:40px 30px;border-radius:30px;text-align:center;max-width:380px;width:90%;box-shadow:0 20px 50px rgba(255,105,180,0.4);border:2px solid white;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-family:'Pacifico',cursive;color:#ff2e7e;font-size:32px}
.name{font-size:42px;font-family:'Pacifico',cursive;color:#ff006a;text-shadow:0 0 15px #ffb3d1}
p{color:#8a4a64;margin:15px 0;line-height:1.6;font-size:15px}
.heart{font-size:50px;animation:beat 0.8s infinite alternate;display:inline-block}
@keyframes beat{to{transform:scale(1.3)}}
.btn{margin-top:20px;background:linear-gradient(45deg,#ff006a,#ff7eb3);color:white;border:none;padding:14px 30px;border-radius:50px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 10px 20px rgba(255,0,106,0.3)}
#hiddenMsg{display:none;margin-top:20px;color:#ff006a;font-weight:500}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="card">
  <div class="heart">💖</div>
  <h1>Hai Cantik</h1>
  <div class="name">Sayangku</div>
  <p>
    Kamu tau gak?<br>
    Sejak kenal kamu, dunia aku jadi full pink kayak gini.<br><br>
    Kamu itu cantiknya gak ada obat, manisnya kelewatan.<br>
    Aku sayang kamu, hari ini, besok, selamanya.
  </p>
  <button class="btn" onclick="showLove()">Klik ini ya 💌</button>
  <div id="hiddenMsg">Aku sayang banget sama kamu, lebih dari game apa pun. Stay sama aku terus ya? 🫶<br><br>- Dari Arfan/zarr -</div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.width=innerWidth;canvas.height=innerHeight;
const hearts=["💖","💗","💓","💕","💞","❤️","🌸","💘"];
const cols=Math.floor(canvas.width/22),drops=Array(cols).fill(0);
setInterval(()=>{
  ctx.fillStyle="rgba(255,214,231,0.15)";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.font="22px serif";
  for(let i=0;i<drops.length;i++){
    ctx.fillStyle=i%2==0?"#ff006a":"#ff7eb3";
    ctx.fillText(hearts[Math.floor(Math.random()*hearts.length)],i*22,drops[i]*22);
    if(drops[i]*22>canvas.height&&Math.random()>0.975)drops[i]=0;
    drops[i]++;
  }
},50);
function showLove(){
  document.getElementById('hiddenMsg').style.display='block';
  for(let i=0;i<80;i++){
    const el=document.createElement('div');
    el.innerHTML="💖";el.style.position="fixed";el.style.left=Math.random()*100+"vw";el.style.top="-10px";
    el.style.fontSize=(Math.random()*20+15)+"px";el.style.animation=`fall ${Math.random()*2+2}s linear`;el.style.zIndex=5;
    document.body.appendChild(el);setTimeout(()=>el.remove(),3000);
  }
}
const s=document.createElement('style');s.innerHTML=`@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}`;document.head.appendChild(s);
</script>
</body>
</html>
